name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Automated SemVer Tag & Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'chore(release)')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Determine next SemVer version
        id: versioning
        shell: bash
        run: |
          set -euo pipefail
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [[ -z "$latest_tag" ]]; then
            base_version="v0.1.0"
            commits=$(git log --format='%H %s')
          else
            base_version="$latest_tag"
            commits=$(git log "${latest_tag}..HEAD" --format='%H %s')
          fi
          bump="patch"
          if grep -qE '^[a-f0-9]+ (feat|fix)(\([^)]*\))?!:' <<< "$commits"; then
            grep -qE '^[a-f0-9]+ feat(\([^)]*\))?!:' <<< "$commits" && bump="major"
          elif grep -qE '^[a-f0-9]+ feat(\([^)]*\))?:' <<< "$commits"; then
            bump="minor"
          fi
          raw_ver="${base_version#v}"
          IFS='.' read -r major minor patch <<< "$raw_ver"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)); ;;
          esac
          next_version="v${major}.${minor}.${patch}"
          git rev-parse --verify --quiet "refs/tags/$next_version" >/dev/null && exit 1 || true
          echo "tag=$next_version" >> "$GITHUB_OUTPUT"

      - name: Build complete release assets
        run: node scripts/release.mjs assets

      - name: Validate every plugin and pack ZIP asset
        shell: bash
        run: |
          set -euo pipefail
          test -s .release/stack-release.json
          test -s .release/stack-release.sha256
          test -s .release/component-assets.json
          test -s .release/SHA256SUMS
          node --input-type=module <<'NODE'
          import { promises as fs } from 'node:fs';
          import { join } from 'node:path';
          const root = process.cwd();
          const release = join(root, '.release');
          const inventory = JSON.parse(await fs.readFile(join(release, 'component-assets.json'), 'utf8'));
          const expectedPlugins = [];
          const expectedPacks = [];
          async function walk(base, relative = '') {
            for (const entry of await fs.readdir(base, { withFileTypes: true })) {
              if (!entry.isDirectory() || entry.name.startsWith('.')) continue;
              const dir = join(base, entry.name);
              const rel = relative ? `${relative}/${entry.name}` : entry.name;
              try {
                await fs.access(join(dir, 'package.json'));
                return [{ dir, rel }];
              } catch {}
              const nested = await walk(dir, rel);
              if (nested.length) return nested;
            }
            return [];
          }
          async function collect(base) {
            const result = [];
            async function visit(dir, relative) {
              for (const entry of await fs.readdir(dir, { withFileTypes: true })) {
                if (!entry.isDirectory() || entry.name.startsWith('.')) continue;
                const child = join(dir, entry.name);
                const rel = relative ? `${relative}/${entry.name}` : entry.name;
                try {
                  await fs.access(join(child, 'package.json'));
                  result.push(rel);
                } catch {
                  await visit(child, rel);
                }
              }
            }
            await visit(base, '');
            return result.sort();
          }
          const plugins = (await collect(join(root, 'plugins'))).filter((rel) => !rel.startsWith('packs/'));
          const packs = await collect(join(root, 'plugins', 'packs'));
          const pluginZips = inventory.plugins.map((name) => name.replace(/^plugin-/, '').replace(/\.zip$/, '')).sort();
          const packZips = inventory.packs.map((name) => name.replace(/^pack-/, '').replace(/\.zip$/, '')).sort();
          if (JSON.stringify(pluginZips) !== JSON.stringify(plugins)) {
            throw new Error(`Plugin ZIP inventory mismatch. Expected ${plugins.length}, generated ${pluginZips.length}.`);
          }
          if (JSON.stringify(packZips) !== JSON.stringify(packs)) {
            throw new Error(`Pack ZIP inventory mismatch. Expected ${packs.length}, generated ${packZips.length}.`);
          }
          for (const file of [...inventory.plugins, ...inventory.packs]) {
            const archive = join(release, file);
            await fs.access(archive);
            const stat = await fs.stat(archive);
            if (!stat.size) throw new Error(`Empty release asset: ${file}`);
          }
          console.log(`Validated ${plugins.length} plugin ZIPs and ${packs.length} pack ZIPs.`);
          NODE

      - name: Create GitHub release and upload all assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.versioning.outputs.tag }}
        run: |
          gh release create "$TAG" .release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $TAG" \
            --generate-notes
