name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Automated SemVer Tag & Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'chore(release)')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine Next SemVer Version
        id: versioning
        shell: bash
        run: |
          set -euo pipefail

          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [[ -z "$latest_tag" ]]; then
            base_version="v0.1.0"
            commits=$(git log --format='%H %s' HEAD)
            echo "No existing SemVer tag found; using initial version $base_version."
          else
            base_version="$latest_tag"
            commits=$(git log "${latest_tag}..HEAD" --format='%H %s')
            echo "Latest tag: $latest_tag"
          fi

          bump="patch"
          if grep -qE '^[a-f0-9]+ (feat|fix)(\([^)]*\))?!:' <<< "$commits"; then
            if grep -qE '^[a-f0-9]+ feat(\([^)]*\))?!:' <<< "$commits"; then
              bump="major"
            fi
          elif grep -qE '^[a-f0-9]+ feat(\([^)]*\))?:' <<< "$commits"; then
            bump="minor"
          fi

          raw_ver="${base_version#v}"
          IFS='.' read -r major minor patch <<< "$raw_ver"

          case "$bump" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          next_version="v${major}.${minor}.${patch}"
          if git rev-parse --verify --quiet "refs/tags/$next_version" >/dev/null; then
            echo "Calculated tag $next_version already exists."
            exit 1
          fi

          echo "Next version: $next_version"
          echo "tag=$next_version" >> "$GITHUB_OUTPUT"

      - name: Create Git Tag & Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: Release ${{ steps.versioning.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
