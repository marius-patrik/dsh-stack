name: Merge enforcement

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # A synchronize supersedes the previous run; cancel it rather than letting
  # two runs of this job compete for the self-hosted pool.
  group: merge-enforcement-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  merge-enforcement:
    name: Merge enforcement
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main

      - name: Require PR to contain current main
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo 'This pull request is behind main.'
            exit 1
          fi

      # The "other required checks are green" condition is enforced by branch
      # protection itself (Canonical Stack workspace + Format repository are
      # required checks), so this job does not re-derive it. It used to poll
      # the checks API for up to 15 minutes, which pinned a self-hosted runner
      # per PR while waiting for CI jobs that were themselves queued behind
      # that very runner — with two runners, two such jobs deadlocked the
      # queue and both timed out. This job now only asserts what branch
      # protection cannot: that the PR head contains the current main tip.
