name: One-time formatting normalization
on:
  push:
    branches: [refactor/composition-tree]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[normalize-format]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install frozen native dependencies
        run: bun install --frozen-lockfile
      - name: Normalize repository formatting
        run: bun run format
      - name: Commit formatting and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize nested plugin tree [normalize-format]"
          git push origin HEAD:refactor/composition-tree
