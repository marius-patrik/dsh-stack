name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

jobs:
  verify:
    name: Canonical Stack workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck Stack workspace
        run: pnpm typecheck

      - name: Build Stack workspace
        run: pnpm build

      - name: Verify Stack workspace
        run: pnpm verify

      - name: Test Stack workspace
        run: pnpm test
