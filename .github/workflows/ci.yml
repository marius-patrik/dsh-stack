name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # One active run per branch: pull_request and push events for the same
  # branch share a group so a superseding push cancels the stale run instead
  # of doubling the runner queue.
  group: ci2-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Canonical Stack workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm

      # No actions/cache step for the store: each self-hosted runner already
      # keeps a persistent per-runner store (npm_config_store_dir in its .env),
      # and the cached path above pointed at ~/.local/share/pnpm/store, which
      # is not where either runner actually stores packages.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Stack workspace
        run: pnpm build

      - name: Typecheck Stack workspace
        run: pnpm typecheck

      - name: Verify Stack workspace
        run: pnpm verify

      - name: Test Stack workspace
        run: pnpm test

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm

      # No actions/cache step for the store: each self-hosted runner already
      # keeps a persistent per-runner store (npm_config_store_dir in its .env),
      # and the cached path above pointed at ~/.local/share/pnpm/store, which
      # is not where either runner actually stores packages.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high+ severity)
        run: pnpm audit --audit-level=high
