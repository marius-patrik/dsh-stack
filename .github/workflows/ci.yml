name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # One active run per branch: pull_request and push events for the same
  # branch share a group so a superseding push cancels the stale run instead
  # of doubling the runner queue.
  group: ci2-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Canonical Stack workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm

      # setup-node's cache: pnpm above already restores the pnpm store from
      # GitHub's cache service on hosted runners; a separate actions/cache step
      # for the store would just duplicate it.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TypeScript incremental state, restored so tsc can skip unchanged
      # projects instead of recompiling all 73 packages. A fresh checkout has no
      # lib/ or .tsbuildinfo, so without this the incremental flag buys nothing
      # in CI. The key is per-commit with progressively looser restore-keys, so
      # a run warm-starts from the most recent build and tsc itself decides what
      # is actually stale -- the cache is a warm start, not a correctness claim.
      - name: Restore TypeScript build state
        uses: actions/cache@v4
        with:
          path: |
            src/packages/*/lib
            publish/plugins/*/lib
            publish/extensions/*/lib
            publish/packs/*/lib
            **/*.tsbuildinfo
          key: ts-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ts-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            ts-build-${{ runner.os }}-

      # The cache above is keyed by lockfile hash with loose restore-keys, so
      # it can warm-start from a run that predates a package deletion -- the
      # restored lib/ for a since-removed src/packages/<id> has no sibling
      # package.json in this checkout, which the workspace verifier reads as
      # a broken package rather than a stale artifact. Prune any restored
      # lib/ whose canonical package.json is gone before the cache's content
      # reaches build/verify/typecheck.
      - name: Prune orphaned build cache
        run: |
          for lib in src/packages/*/lib publish/plugins/*/lib publish/extensions/*/lib publish/packs/*/lib; do
            [ -d "$lib" ] || continue
            pkg="$(dirname "$lib")"
            if [ ! -f "$pkg/package.json" ]; then
              echo "Removing orphaned build cache: $lib (no $pkg/package.json)"
              rm -rf "$lib"
            fi
          done

      - name: Build Stack workspace
        run: pnpm build

      # Diagnostic for a currently-open investigation (dsh-stack#123 CI
      # fallout): src/packages/workspace-tabs was deleted from this branch,
      # the prune step above confirms it removes a cache-restored lib/ for
      # it, yet verify-stack.mjs still finds the directory moments later.
      # Prints whatever exists right before verify runs so the next run
      # shows exactly what recreated it. Remove once that's understood.
      - name: Diagnose workspace-tabs recreation
        run: |
          if [ -e src/packages/workspace-tabs ]; then
            echo "src/packages/workspace-tabs EXISTS before verify:"
            find src/packages/workspace-tabs -exec ls -la {} \;
          else
            echo "src/packages/workspace-tabs does not exist before verify"
          fi

      - name: Verify Stack workspace
        run: pnpm verify

      - name: Test Stack workspace
        run: pnpm test

  typecheck:
    name: Typecheck Stack workspace
    runs-on: ubuntu-latest

    # Split out of the workspace job rather than left in sequence with it.
    # Build and typecheck were the two dominant steps -- roughly eleven minutes
    # each -- and running them back to back put every pull request behind ~22
    # minutes of work that has no ordering requirement between the two halves.
    # They are not redundant: the build compiles tsconfig.json, while typecheck
    # uses the broader tsconfig.typecheck.json that also covers test sources.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TypeScript incremental state, restored so tsc can skip unchanged
      # projects instead of recompiling all 73 packages. A fresh checkout has no
      # lib/ or .tsbuildinfo, so without this the incremental flag buys nothing
      # in CI. The key is per-commit with progressively looser restore-keys, so
      # a run warm-starts from the most recent build and tsc itself decides what
      # is actually stale -- the cache is a warm start, not a correctness claim.
      - name: Restore TypeScript build state
        uses: actions/cache@v4
        with:
          path: |
            src/packages/*/lib
            publish/plugins/*/lib
            publish/extensions/*/lib
            publish/packs/*/lib
            **/*.tsbuildinfo
          key: ts-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ts-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            ts-build-${{ runner.os }}-

      # The cache above is keyed by lockfile hash with loose restore-keys, so
      # it can warm-start from a run that predates a package deletion -- the
      # restored lib/ for a since-removed src/packages/<id> has no sibling
      # package.json in this checkout, which the workspace verifier reads as
      # a broken package rather than a stale artifact. Prune any restored
      # lib/ whose canonical package.json is gone before the cache's content
      # reaches build/verify/typecheck.
      - name: Prune orphaned build cache
        run: |
          for lib in src/packages/*/lib publish/plugins/*/lib publish/extensions/*/lib publish/packs/*/lib; do
            [ -d "$lib" ] || continue
            pkg="$(dirname "$lib")"
            if [ ! -f "$pkg/package.json" ]; then
              echo "Removing orphaned build cache: $lib (no $pkg/package.json)"
              rm -rf "$lib"
            fi
          done

      - name: Build Stack workspace
        run: pnpm build

      - name: Typecheck Stack workspace
        run: pnpm typecheck

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm

      # setup-node's cache: pnpm above already restores the pnpm store from
      # GitHub's cache service on hosted runners; a separate actions/cache step
      # for the store would just duplicate it.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high+ severity)
        run: pnpm audit --audit-level=high
