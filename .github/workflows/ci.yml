name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # One active run per branch: pull_request and push events for the same
  # branch share a group so a superseding push cancels the stale run instead
  # of doubling the runner queue.
  group: ci2-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Canonical Stack workspace
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          package-manager-cache: false

      # Isolate the pnpm install per runner: pnpm/action-setup defaults to
      # ~/setup-pnpm, which every self-hosted runner on this machine shares.
      # Two jobs installing pnpm concurrently raced on that directory and
      # failed with ENOTEMPTY / "Cannot find module .../pnpm/dist/worker.js".
      # Keying on runner.name also lets the pool grow without new collisions.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          dest: ~/setup-pnpm-${{ runner.name }}

      # No actions/cache step for the store: each self-hosted runner already
      # keeps a persistent per-runner store (npm_config_store_dir in its .env),
      # and the cached path above pointed at ~/.local/share/pnpm/store, which
      # is not where either runner actually stores packages.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Stack workspace
        run: pnpm build

      - name: Verify Stack workspace
        run: pnpm verify

      - name: Test Stack workspace
        run: pnpm test

  typecheck:
    name: Typecheck Stack workspace
    runs-on: [self-hosted, macOS, ARM64]

    # Split out of the workspace job rather than left in sequence with it.
    # Build and typecheck were the two dominant steps -- roughly eleven minutes
    # each -- and running them back to back put every pull request behind ~22
    # minutes of work that has no ordering requirement between the two halves.
    # They are not redundant: the build compiles tsconfig.json, while typecheck
    # uses the broader tsconfig.typecheck.json that also covers test sources.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          dest: ~/setup-pnpm-${{ runner.name }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Stack workspace
        run: pnpm build

      - name: Typecheck Stack workspace
        run: pnpm typecheck

  dependency-audit:
    name: Dependency audit
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          dest: ~/setup-pnpm-${{ runner.name }}

      # No actions/cache step for the store: each self-hosted runner already
      # keeps a persistent per-runner store (npm_config_store_dir in its .env),
      # and the cached path above pointed at ~/.local/share/pnpm/store, which
      # is not where either runner actually stores packages.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high+ severity)
        run: pnpm audit --audit-level=high
