name: Finish path and Knip normalization
on:
  push:
    branches: [refactor/composition-tree]
permissions:
  contents: write
jobs:
  normalize:
    if: "!contains(github.event.head_commit.message, '[normalized-native-tree]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Fix development import after provider relocation
        run: sed -i 's|../provider-zen/lib/index.js|../../../provider-zen/lib/index.js|g' plugins/stack/ai/providers/providers/.z.mjs
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Normalize formatter output
        run: bun run format
      - name: Commit migration completion
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-native-tree.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: normalize package analysis and relocated import [normalized-native-tree]"
          git push origin HEAD:refactor/composition-tree
