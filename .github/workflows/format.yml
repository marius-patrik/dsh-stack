name: Format repository

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: format-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          package-manager-cache: false

      - name: Verify repository formatting
        run: |
          npx --yes @biomejs/biome@2.2.0 format --write .
          if ! git diff --quiet; then
            echo "::error::Repository contains unformatted files. Run 'npx @biomejs/biome format --write .' locally before pushing."
            git diff --stat
            git diff
            exit 1
          fi
          echo "Repository formatting is clean."
