name: Complete unified plugin tree migration
on:
  push:
    branches: [refactor/composition-tree]
permissions:
  contents: write
jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[plugin-tree-migration]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Rebase repository references and docs
        run: node scripts/fix-plugin-tree-once.mjs
      - name: Refresh Bun lockfile
        run: bun install --lockfile-only
      - name: Format all moved source files
        run: bunx biome format --write .
      - name: Retire one-shot migration and commit verified paths
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-plugin-tree.yml scripts/fix-plugin-tree-once.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve nested plugin imports, docs, and lockfile [plugin-tree-migration]"
          git push origin HEAD:refactor/composition-tree
