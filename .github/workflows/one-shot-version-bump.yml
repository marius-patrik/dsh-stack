name: Synchronize native package versions after source relocation

on:
  push:
    branches: [fix/native-package-version-collision]

permissions:
  contents: write

jobs:
  version:
    if: "!contains(github.event.head_commit.message, '[native-version-bumped]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Bump all changed native package publication versions
        run: node scripts/bump-native-versions-once.mjs
      - name: Synchronize Bun workspace lockfile
        run: bun install --lockfile-only
      - name: Format native manifests
        run: bunx biome format --write .
      - name: Verify version inventory
        run: |
          node -e 'const l=require("./bun.lock");if(!l.workspaces)throw new Error("No Bun workspaces")' || test -s bun.lock
      - name: Commit and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-version-bump.yml scripts/bump-native-versions-once.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix: assign new immutable versions to all relocated native packages [native-version-bumped]"
          git push origin HEAD:fix/native-package-version-collision
