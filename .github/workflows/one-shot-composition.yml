name: One-shot composition migration
on:
  push:
    branches: [refactor/composition-tree]
permissions:
  contents: write
jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[composition-migration]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Repair relative references and canonical documentation
        run: node scripts/migrate-composition-once.mjs
      - name: Synchronize Bun lockfile with moved native workspaces
        run: bun install --lockfile-only
      - name: Retire one-shot migration
        run: |
          rm .github/workflows/one-shot-composition.yml scripts/migrate-composition-once.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: normalize composition references and lockfile [composition-migration]"
          git push origin HEAD:refactor/composition-tree
