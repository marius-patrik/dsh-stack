name: Finalize native plugin ownership tree
on:
  push:
    branches: [refactor/composition-tree]
permissions:
  contents: write
jobs:
  rebase:
    if: "!contains(github.event.head_commit.message, '[ownership-rebased]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Rewrite relocated imports and documentation
        run: node scripts/rebase-ownership-once.mjs
      - name: Refresh workspace lock
        run: bun install --lockfile-only
      - name: Normalize source format
        run: bunx biome format --write .
      - name: Retire one-shot migration and commit
        run: |
          set -euo pipefail
          rm scripts/rebase-ownership-once.mjs .github/workflows/rebase-ownership-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: rebase nested native package references [ownership-rebased]"
          git push origin HEAD:refactor/composition-tree
