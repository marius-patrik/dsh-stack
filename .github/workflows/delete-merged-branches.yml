name: Delete merged branches

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    name: Delete merged branches
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch for closed PR
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        # The ref is usually already gone by the time this fires: `gh pr merge`
        # and GitHub's own auto-delete-branch setting both remove it first, and
        # DELETE on a missing ref is a hard 422 ("Reference does not exist"),
        # which failed this workflow on every merge. Match the reconcile step
        # below and only delete a ref that is still there.
        run: |
          set -euo pipefail
          if gh api --silent "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" >/dev/null 2>&1; then
            echo "Deleting merged branch: ${BRANCH}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
          else
            echo "Branch ${BRANCH} is already gone; nothing to delete."
          fi

      - name: Reconcile merged same-repository branches
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr list --repo "${GITHUB_REPOSITORY}" --state merged --limit 100 --json headRefName,baseRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository == false and .baseRefName == "main" and .headRefName != "main") | .headRefName' \
            | while IFS= read -r branch; do
                [ -z "$branch" ] && continue
                if gh api --silent "repos/${GITHUB_REPOSITORY}/branches/${branch}" >/dev/null 2>&1; then
                  echo "Deleting merged branch: ${branch}"
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
                fi
              done
