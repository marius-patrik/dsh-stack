name: Browser verification

# Verify the native published shape against a clean, independently built DSH.
on:
  pull_request:
    paths:
      - "plugins/**"
      - "profiles/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "package.json"
      - "bun.lock"
      - ".gitmodules"

permissions:
  contents: read

concurrency:
  group: browser-native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DSH_INSTALL: /tmp/dsh-install
      DSH_HOME: ${{ github.workspace }}/.ci-home

    steps:
      - name: Checkout Stack repository
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0

      - name: Install pnpm for native DSH
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Install Stack workspace
        run: bun install --frozen-lockfile

      - name: Build Stack and generate native DSH bundle patches
        run: bun run build

      - name: Pack local npm tarball fixture graph
        run: bun run release:local-fixtures

      - name: Install independently published compatible DSH
        run: npm install --prefix "$DSH_INSTALL" --no-audit --no-fund @deepseek-ai/dsh@0.2.0-rc.2

      - name: Native DSH install into a fresh profile
        run: |
          set -euo pipefail
          stack_tarball="$(node -e 'const p=require("./.ci-packages/fixtures.json");process.stdout.write(p["@dsh-stack/stack"])')"
          node "$DSH_INSTALL/node_modules/@deepseek-ai/dsh/lib/bin.js" plugin --profile web add "file:$stack_tarball"
          node "$DSH_INSTALL/node_modules/@deepseek-ai/dsh/lib/bin.js" --profile web --dump-config > "$RUNNER_TEMP/composed-web.yml"
          grep -q "@dsh-stack/" "$RUNNER_TEMP/composed-web.yml"

      - name: Native DSH install Chimney TUI profile
        run: |
          set -euo pipefail
          stack_tarball="$(node -e 'const p=require("./.ci-packages/fixtures.json");process.stdout.write(p["@dsh-stack/stack"])')"
          node "$DSH_INSTALL/node_modules/@deepseek-ai/dsh/lib/bin.js" plugin --profile headless add "file:$stack_tarball"
          node "$DSH_INSTALL/node_modules/@deepseek-ai/dsh/lib/bin.js" --profile headless --dump-config > "$RUNNER_TEMP/composed-headless.yml"
          grep -q "@dsh-stack/" "$RUNNER_TEMP/composed-headless.yml"
          node "$DSH_INSTALL/node_modules/@deepseek-ai/dsh/lib/bin.js" plugin --profile tui add "file:$stack_tarball"
          node "$DSH_INSTALL/node_modules/@deepseek-ai/dsh/lib/bin.js" plugin --profile tui add @deepseek-harness-tui/dsh-tui@0.14.0
          node "$DSH_INSTALL/node_modules/@deepseek-ai/dsh/lib/bin.js" --profile tui --dump-config > "$RUNNER_TEMP/composed-tui.yml"
          grep -q '@deepseek-harness-tui/dsh-tui' "$RUNNER_TEMP/composed-tui.yml"
          # The DSH surfaces differ, but the Stack plugin inventory must match.
          for profile in web headless tui; do
            grep -oE '@dsh-stack/[a-z0-9-]+' "$RUNNER_TEMP/composed-${profile}.yml" | sort -u > "$RUNNER_TEMP/stack-${profile}.txt"
          done
          diff -u "$RUNNER_TEMP/stack-web.txt" "$RUNNER_TEMP/stack-headless.txt"
          diff -u "$RUNNER_TEMP/stack-web.txt" "$RUNNER_TEMP/stack-tui.txt"

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Boot installed native Web profile
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/screenshots"
          nohup node "$DSH_INSTALL/node_modules/@deepseek-ai/dsh/lib/bin.js" --profile web --no-open --port 0 > "$RUNNER_TEMP/dsh-web.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/dsh-web.pid"
          for i in $(seq 1 60); do
            if grep -qE 'http://127\.0\.0\.1:[0-9]+' "$RUNNER_TEMP/dsh-web.log" 2>/dev/null; then
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/dsh-web.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/dsh-web.log"
              exit 1
            fi
            sleep 5
          done
          cat "$RUNNER_TEMP/dsh-web.log"

      - name: Verify the installed Stack UI in Chromium
        run: |
          set -euo pipefail
          url="$(grep -oE 'http://127\.0\.0\.1:[0-9]+/\?token=[A-Za-z0-9_-]+' "$RUNNER_TEMP/dsh-web.log" | tail -1)"
          if [ -z "$url" ]; then
            echo "::error::Native DSH did not report an authenticated browser URL"
            exit 1
          fi
          node scripts/browser-check.mjs "$url" \
            --screenshot "$RUNNER_TEMP/screenshots/web-profile.png"

      - name: Collect DSH boot and composition logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          cp "$RUNNER_TEMP/dsh-web.log" "$RUNNER_TEMP/screenshots/dsh-web.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/composed-web.yml" "$RUNNER_TEMP/screenshots/composed-web.yml" 2>/dev/null || true
          cp "$RUNNER_TEMP/composed-tui.yml" "$RUNNER_TEMP/screenshots/composed-tui.yml" 2>/dev/null || true
          cp "$RUNNER_TEMP/composed-headless.yml" "$RUNNER_TEMP/screenshots/composed-headless.yml" 2>/dev/null || true

      - name: Stop native DSH
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/dsh-web.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/dsh-web.pid")" 2>/dev/null || true
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-native-${{ github.event.pull_request.number || github.run_id }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
